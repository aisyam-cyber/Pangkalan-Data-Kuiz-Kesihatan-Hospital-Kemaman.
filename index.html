<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuiz Interaktif Facebook dengan Leaderboard</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      padding: 0; 
    }

    body { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }

    .card { 
      background: #ffffff; 
      width: 100%; 
      max-width: 520px; 
      border-radius: 20px; 
      padding: 30px; 
      box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
      position: relative;
      overflow: hidden;
    }

    h1 { 
      font-size: 1.6rem; 
      text-align: center; 
      color: #2d3748; 
      margin-bottom: 8px; 
    }

    p.subtitle { 
      text-align: center; 
      color: #718096; 
      margin-bottom: 25px; 
      font-size: 0.95rem; 
    }

    input[type="text"] { 
      width: 100%; 
      padding: 14px; 
      border: 2px solid #e2e8f0; 
      border-radius: 12px; 
      font-size: 1rem; 
      margin-bottom: 15px; 
      outline: none; 
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { 
      border-color: #667eea; 
    }

    .btn { 
      width: 100%; 
      background: #667eea; 
      color: #ffffff; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s; 
    }

    .btn:hover { 
      background: #5a67d8; 
    }

    .btn:active {
      transform: scale(0.98);
    }

    .loading { 
      text-align: center; 
      display: none; 
      padding: 30px 0; 
      font-weight: 500; 
      color: #4a5568; 
      line-height: 1.6;
    }

    .quiz-box { 
      display: none; 
    }

    .timer-container {
      width: 100%;
      background: #edf2f7;
      height: 8px;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      background: #48bb78;
      width: 100%;
      transition: width 1s linear, background-color 0.3s;
    }

    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .timer-badge {
      font-weight: bold;
      color: #e53e3e;
      background: #fff5f5;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #fed7d7;
    }

    .question { 
      font-size: 1.15rem; 
      font-weight: 600; 
      color: #2d3748; 
      margin-bottom: 20px; 
      line-height: 1.4;
    }

    .options { 
      display: grid; 
      gap: 12px; 
      margin-bottom: 20px; 
    }

    .opt-btn { 
      background: #f7fafc; 
      border: 2px solid #e2e8f0; 
      padding: 14px; 
      border-radius: 12px; 
      text-align: left; 
      cursor: pointer; 
      font-size: 0.95rem; 
      color: #4a5568;
      font-weight: 500;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background: #edf2f7;
      border-color: #cbd5e0;
    }

    .opt-btn.correct { 
      background: #48bb78 !important; 
      color: #ffffff !important; 
      border-color: #38a169 !important; 
    }

    .opt-btn.wrong { 
      background: #f56565 !important; 
      color: #ffffff !important; 
      border-color: #e53e3e !important; 
    }

    .footer { 
      display: flex; 
      justify-content: space-between; 
      font-size: 0.9rem; 
      color: #718096; 
      font-weight: 600;
      border-top: 1px solid #edf2f7;
      padding-top: 15px;
    }

    .result-screen {
      display: none;
      text-align: center;
    }

    .score-badge {
      font-size: 3.5rem;
      font-weight: bold;
      color: #667eea;
      margin: 15px 0 20px 0;
    }

    .leaderboard-box {
      display: none;
      text-align: left;
      margin-top: 20px;
      background: #f7fafc;
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .leaderboard-box ol {
      padding-left: 20px;
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. SKRIN INPUT TAJUK -->
    <div id="setup-screen">
      <h1>🎮 Kuiz Interaktif AI</h1>
      <p class="subtitle">Masukkan sebarang tajuk dan AI akan jana 10 soalan automatik!</p>
      <input type="text" id="topic-input" placeholder="Contoh: Sejarah Malaysia, Sains, Makanan...">
      <button class="btn" onclick="startQuiz()">Jana & Mula Kuiz 🚀</button>
    </div>

    <!-- 2. SKRIN LOADING -->
    <div id="loading-screen" class="loading">
      ⏳ AI sedang menjana 10 soalan dwibahasa...<br>
      <small style="color: #a0aec0;">(Sila tunggu beberapa saat)</small>
    </div>

    <!-- 3. SKRIN KUIZ -->
    <div id="quiz-screen" class="quiz-box">
      <div class="timer-header">
        <h2 id="quiz-title" style="font-size: 1.1rem; color: #667eea;">Tajuk Kuiz</h2>
        <span class="timer-badge" id="timer-text">⏱️ 15s</span>
      </div>

      <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div class="question" id="q-text">Teks Soalan</div>
      <div class="options" id="opt-container"></div>

      <div class="footer">
        <span id="q-count">Soalan 1 / 10</span>
        <span id="score-text">Markah: 0</span>
      </div>
    </div>

    <!-- 4. SKRIN KEPUTUSAN & LEADERBOARD -->
    <div id="result-screen" class="result-screen">
      <h1>Tahniah! 🎉</h1>
      <p style="color: #718096; margin-top: 5px;">Skor Akhir Anda:</p>
      <div class="score-badge" id="final-score">0 / 10</div>

      <!-- BORANG SIMPAN LEADERBOARD -->
      <div id="save-score-box" style="margin-bottom: 20px;">
        <input type="text" id="player-name" placeholder="Masukkan nama anda..." />
        <button class="btn" onclick="submitScore()">Simpan Markah ke Leaderboard 🏆</button>
      </div>

      <!-- PAPARAN TOP 10 LEADERBOARD -->
      <div id="leaderboard-box" class="leaderboard-box">
        <h3 style="text-align: center; color: #2d3748; margin-bottom: 12px;">👑 Top 10 Pemain Terbaik</h3>
        <ol id="leaderboard-list"></ol>
      </div>

      <button class="btn" onclick="location.reload()" style="margin-top: 20px; background: #4a5568;">Main Kuiz Baharu 🔄</button>
    </div>
  </div>

  <script>
    // ⚠️ GANTIKAN URL DI BAWAH DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDp-DVIxU5QK4dPk4RuRTr2E0qQRKWhVmGCNG-7xR2XMraBticOMD0T0082lvAhNkI/exec";

    // Kesan Bunyi (Sound Effects)
    const soundCorrect = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
    const soundWrong = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    const soundTimeOut = new Audio('https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3');

    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let timerInterval;
    const TIME_LIMIT = 15;
    let timeLeft = TIME_LIMIT;

    async function startQuiz() {
      const topic = document.getElementById('topic-input').value.trim();
      if (!topic) return alert("Sila masukkan tajuk kuiz!");

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'block';

      try {
        const res = await fetch(`${SCRIPT_URL}?tajuk=${encodeURIComponent(topic)}`);
        const data = await res.json();

        if (data.status === "error" || !data.soalan || data.soalan.length === 0) {
          alert("Gagal menjana soalan. Sila cuba tajuk lain!");
          location.reload();
          return;
        }

        questions = data.soalan;
        document.getElementById('quiz-title').innerText = data.tajuk || "Kuiz Interaktif";
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        showQuestion();
      } catch (err) {
        alert("Ralat sambungan! Pastikan Web App URL telah dikemaskini.");
        location.reload();
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_LIMIT;
      updateTimerUI();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('timer-text').innerText = `⏱️ ${timeLeft}s`;
      const bar = document.getElementById('timer-bar');
      const percentage = (timeLeft / TIME_LIMIT) * 100;
      bar.style.width = `${percentage}%`;

      if (timeLeft <= 5) {
        bar.style.backgroundColor = '#f56565';
      } else if (timeLeft <= 8) {
        bar.style.backgroundColor = '#ed8936';
      } else {
        bar.style.backgroundColor = '#48bb78';
      }
    }

    function handleTimeOut() {
      soundTimeOut.play().catch(() => {});
      const q = questions[currentIdx];
      const allBtns = document.querySelectorAll('.opt-btn');
      
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      Object.keys(q.pilihan).forEach((key, idx) => {
        if (key === q.jawapanBetul) allBtns[idx].classList.add('correct');
      });

      setTimeout(nextQuestion, 1500);
    }

    function showQuestion() {
      const q = questions[currentIdx];
      document.getElementById('q-text').innerText = `${currentIdx + 1}. ${q.soalan}`;
      document.getElementById('q-count').innerText = `Soalan ${currentIdx + 1} / ${questions.length}`;
      
      const container = document.getElementById('opt-container');
      container.innerHTML = '';

      Object.keys(q.pilihan).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${key}) ${q.pilihan[key]}`;
        btn.onclick = () => checkAnswer(key, btn);
        container.appendChild(btn);
      });

      startTimer();
    }

    function checkAnswer(selectedKey, btn) {
      clearInterval(timerInterval);
      const q = questions[currentIdx];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none');

      if (selectedKey === q.jawapanBetul) {
        soundCorrect.play().catch(() => {});
        btn.classList.add('correct');
        score++;
        document.getElementById('score-text').innerText = `Markah: ${score}`;
      } else {
        soundWrong.play().catch(() => {});
        btn.classList.add('wrong');
        Object.keys(q.pilihan).forEach((key, idx) => {
          if (key === q.jawapanBetul) allBtns[idx].classList.add('correct');
        });
      }

      setTimeout(nextQuestion, 1200);
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        showQuestion();
      } else {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
      }
    }

    async function submitScore() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) return alert("Sila masukkan nama anda!");

      const saveBtn = event.target;
      saveBtn.innerText = "Laporan disimpan...";
      saveBtn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            nama: name,
            tajuk: document.getElementById('quiz-title').innerText,
            markah: score
          })
        });

        const resData = await response.json();
        if (resData.status === "success" && resData.leaderboard) {
          document.getElementById('save-score-box').style.display = 'none';
          displayLeaderboard(resData.leaderboard);
        } else {
          alert("Markah anda berjaya disimpan!");
          document.getElementById('save-score-box').style.display = 'none';
        }
      } catch (err) {
        alert("Markah anda berjaya disimpan!");
        document.getElementById('save-score-box').style.display = 'none';
      }
    }

    function displayLeaderboard(list) {
      const container = document.getElementById('leaderboard-list');
      container.innerHTML = '';
      
      list.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${item.nama}</strong> - ${item.markah}/10 markah <small style="color:#a0aec0;">(${item.tajuk})</small>`;
        container.appendChild(li);
      });

      document.getElementById('leaderboard-box').style.display = 'block';
    }
  </script>
</body>
</html>
