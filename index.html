<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuiz Interaktif Facebook</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .quiz-card { background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 550px; border-radius: 20px; padding: 30px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; color: #333; }
    .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 15px 0; }
    .progress-fill { height: 100%; background: #667eea; width: 0%; transition: width 0.3s; }

    .question-box { font-size: 1.2rem; font-weight: 600; color: #2d3748; margin-bottom: 20px; min-height: 60px; }
    .options-grid { display: grid; gap: 12px; }
    
    .btn-opt { background: #f7fafc; border: 2px solid #e2e8f0; padding: 14px 20px; border-radius: 12px; font-size: 1rem; color: #4a5568; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn-opt:hover { background: #edf2f7; border-color: #cbd5e0; transform: translateY(-2px); }
    .btn-opt.correct { background: #48bb78 !important; color: white; border-color: #38a169 !important; }
    .btn-opt.wrong { background: #f56565 !important; color: white; border-color: #e53e3e !important; }

    .footer-info { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.9rem; color: #718096; }
    .timer { font-weight: bold; color: #e53e3e; font-size: 1.1rem; }

    .score-screen { text-align: center; display: none; }
    .score-screen h2 { font-size: 2rem; color: #2d3748; margin-bottom: 10px; }
    .score-badge { font-size: 3rem; font-weight: bold; color: #667eea; margin: 20px 0; }
    .btn-restart { background: #667eea; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-restart:hover { background: #5a67d8; }

    .loading { text-align: center; font-size: 1.2rem; color: #4a5568; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div id="loading" class="loading">⏳ Memuatkan Soalan Kuiz...</div>

    <div id="quiz-body" style="display: none;">
      <div class="header">
        <h1 id="quiz-title">Tajuk Kuiz</h1>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      </div>

      <div class="question-box" id="question">Teks Soalan</div>

      <div class="options-grid" id="options">
        <!-- Pilihan jawapan dimasukkan secara dinamik -->
      </div>

      <div class="footer-info">
        <span id="question-count">Soalan 1 / 10</span>
        <span class="timer" id="timer">⏱️ 15s</span>
      </div>
    </div>

    <div id="score-body" class="score-screen">
      <h2>Tahniah! 🎉</h2>
      <p>Anda telah menyelesaikan kuiz ini.</p>
      <div class="score-badge" id="final-score">0 / 10</div>
      <button class="btn-restart" onclick="location.reload()">Main Lagi</button>
    </div>
  </div>

  <script>
    // ⚠️ GANTIKAN URL DI BAWAH DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbzdpfTh08-TXRTM4r6eWvy7Xl5uPpDxoSZg16GpQARARzIYDsGDxkcNN9lrSYkoh1dv/exec";

    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval;

    async function fetchQuiz() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if (!data.soalan || data.soalan.length === 0) {
          document.getElementById('loading').innerHTML = "❌ Tiada soalan dijumpai. Sila jana soalan di Google Sheets.";
          return;
        }

        questions = data.soalan;
        document.getElementById('quiz-title').innerText = data.tajuk;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        
        loadQuestion();
      } catch (err) {
        document.getElementById('loading').innerHTML = "❌ Gagal memuatkan kuiz. Semak pautan API anda.";
      }
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = 15;
      document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
      
      const q = questions[currentIdx];
      document.getElementById('question').innerText = `${currentIdx + 1}. ${q.soalan}`;
      document.getElementById('question-count').innerText = `Soalan ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('progress').style.width = `${((currentIdx) / questions.length) * 100}%`;

      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      Object.keys(q.pilihan).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = `${key}) ${q.pilihan[key]}`;
        btn.onclick = () => selectAnswer(key, btn);
        optionsDiv.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          nextQuestion();
        }
      }, 1000);
    }

    function selectAnswer(selectedKey, selectedBtn) {
      clearInterval(timerInterval);
      const q = questions[currentIdx];
      const allBtns = document.querySelectorAll('.btn-opt');
      
      allBtns.forEach(btn => btn.style.pointerEvents = 'none');

      if (selectedKey === q.jawapanBetul) {
        selectedBtn.classList.add('correct');
        score++;
      } else {
        selectedBtn.classList.add('wrong');
        // Tunjukkan jawapan yang betul
        Object.keys(q.pilihan).forEach((key, idx) => {
          if (key === q.jawapanBetul) allBtns[idx].classList.add('correct');
        });
      }

      setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        showScore();
      }
    }

    function showScore() {
      document.getElementById('quiz-body').style.display = 'none';
      document.getElementById('score-body').style.display = 'block';
      document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
    }

    fetchQuiz();
  </script>
</body>
</html>
